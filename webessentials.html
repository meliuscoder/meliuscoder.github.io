<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Web App Tabs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}body{background:#202124}.header{width:100%;height:58px;background:#202124;display:flex;align-items:center;padding:0 16px;color:#fff}.tabs{width:100%;height:100%;display:flex;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{height:40px;min-width:120px;padding:0 14px;border:0;border-radius:7px 7px 0 0;background:#292a2d;color:#9aa0a6;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;white-space:nowrap;font-size:14px;transition:background .2s ease,color .2s ease;user-select:none}.tab:hover{background:#35363a;color:#fff}.tab.active{background:#fff;color:#202124}.tab-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:0 0 22px;background:transparent;border:0;overflow:hidden}.tab-icon img{width:22px;height:22px;display:block;object-fit:contain;background:transparent}.tab-content{width:100%;height:calc(100vh - 58px);background:#fff;position:relative;overflow:hidden}.page{position:absolute;inset:0;width:100%;height:100%;display:none;background:#fff}.page.active{display:block}.page iframe{width:100%;height:100%;border:0;display:block;background:#fff}.loading{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:#fff;color:#555;font-size:14px;pointer-events:none}.loading.hidden{display:none}.spinner{width:24px;height:24px;border:3px solid #ddd;border-top-color:#4285f4;border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.header{padding:0 8px}.tab{min-width:auto;padding:0 10px}.tab-name{display:none}}
</style>
</head>

<body>

<header class="header">
  <nav class="tabs" id="tabs"></nav>
</header>

<main class="tab-content" id="tabContent"></main>

<script>

/*
 * =========================================================
 * APPLICATION CONFIGURATION
 * =========================================================
 *
 * Change only this array to manage the tabs.
 *
 * name = displayed tab name
 * url  = website URL
 * icon = logo URL
 *
 * The order of this array determines the tab order.
 */

const APP_CONFIG = [

  {
    name: "Gmail",
    url: "https://mail.google.com/",
    icon: "https://api.iconify.design/logos:gmail.svg"
  },

  {
    name: "Google Drive",
    url: "https://drive.google.com/",
    icon: "https://api.iconify.design/logos:google-drive.svg"
  },

  {
    name: "Google Gemini",
    url: "https://gemini.google.com/",
    icon: "https://api.iconify.design/logos:google-gemini.svg"
  },

  {
    name: "Azure Portal",
    url: "https://portal.azure.com/",
    icon: "https://api.iconify.design/logos:microsoft-azure.svg"
  },

  {
    name: "Azure DevOps",
    url: "https://dev.azure.com/",
    icon: "https://api.iconify.design/logos:azure-devops.svg"
  },

  {
    name: "OneDrive",
    url: "https://onedrive.live.com/",
    icon: "https://api.iconify.design/logos:microsoft-onedrive.svg"
  },

  {
    name: "GitHub",
    url: "https://github.com/",
    icon: "https://api.iconify.design/logos:github-icon.svg"
  },

  {
    name: "ChatGPT",
    url: "https://chatgpt.com/",
    icon: "https://api.iconify.design/logos:openai.svg"
  }

];


/*
 * =========================================================
 * DOM REFERENCES
 * =========================================================
 */

const tabsContainer =
  document.getElementById("tabs");

const tabContent =
  document.getElementById("tabContent");


/*
 * =========================================================
 * CREATE TABS
 * =========================================================
 */

function createTabs() {

  tabsContainer.innerHTML = "";

  APP_CONFIG.forEach(function(app, index) {

    const tab =
      document.createElement("button");

    tab.type = "button";
    tab.className = "tab";
    tab.dataset.index = index;

    if (index === 0) {
      tab.classList.add("active");
    }


    /*
     * Icon
     */

    const iconContainer =
      document.createElement("span");

    iconContainer.className =
      "tab-icon";


    const icon =
      document.createElement("img");

    icon.src = app.icon;
    icon.alt = app.name;
    icon.loading = "eager";


    icon.onerror = function() {

      iconContainer.style.display = "none";

    };


    iconContainer.appendChild(icon);


    /*
     * Tab name
     */

    const name =
      document.createElement("span");

    name.className =
      "tab-name";

    name.textContent =
      app.name;


    /*
     * Build tab
     */

    tab.appendChild(iconContainer);
    tab.appendChild(name);


    /*
     * Click handler
     */

    tab.addEventListener(
      "click",
      function() {
        activateTab(index);
      }
    );


    tabsContainer.appendChild(tab);

  });

}


/*
 * =========================================================
 * CREATE PAGES
 * =========================================================
 */

function createPages() {

  tabContent.innerHTML = "";

  APP_CONFIG.forEach(function(app, index) {

    const page =
      document.createElement("section");

    page.className = "page";
    page.id = "page-" + index;


    if (index === 0) {
      page.classList.add("active");
    }


    /*
     * Loading indicator
     */

    const loading =
      document.createElement("div");

    loading.className =
      "loading";

    loading.id =
      "loading-" + index;

    loading.innerHTML =
      '<div class="spinner"></div>' +
      'Loading ' +
      escapeHtml(app.name) +
      '...';


    /*
     * Iframe
     */

    const iframe =
      document.createElement("iframe");

    iframe.title =
      app.name;

    iframe.src =
      app.url;

    iframe.loading =
      index === 0
        ? "eager"
        : "lazy";


    iframe.addEventListener(
      "load",
      function() {

        loading.classList.add("hidden");

      }
    );


    /*
     * Add elements
     */

    page.appendChild(loading);
    page.appendChild(iframe);

    tabContent.appendChild(page);

  });

}


/*
 * =========================================================
 * ACTIVATE TAB
 * =========================================================
 */

function activateTab(index) {

  const tabs =
    document.querySelectorAll(".tab");

  const pages =
    document.querySelectorAll(".page");


  tabs.forEach(function(tab, tabIndex) {

    tab.classList.toggle(
      "active",
      tabIndex === index
    );

  });


  pages.forEach(function(page, pageIndex) {

    page.classList.toggle(
      "active",
      pageIndex === index
    );

  });

}


/*
 * =========================================================
 * HTML ESCAPE
 * =========================================================
 */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/*
 * =========================================================
 * INITIALIZE
 * =========================================================
 */

function initialize() {

  createTabs();
  createPages();

}


initialize();

</script>

</body>
</html>
